<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Base64 인코더 / 디코더 — 불편함 해결소</title>
  <meta name="description" content="텍스트를 Base64로 인코딩하거나 디코딩합니다. 한글(UTF-8) 안전 처리. 무료 온라인 Base64 도구." />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔁</text></svg>" />
  <link rel="stylesheet" href="../assets/style.css" />
  <!-- 애드센스 승인 후 아래 주석 해제 + 게시자 ID 교체
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
  -->
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="../index.html"><span class="logo">🛠️</span><span>불편함 해결소<small>매일 쓰는 작은 도구 모음</small></span></a>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="테마 전환">🌙</button>
    </div>
  </header>

  <main class="wrap">
    <div class="breadcrumb"><a href="../index.html">홈</a> › 개발자 도구 › Base64</div>
    <div class="tool-head">
      <h1>🔁 Base64 인코더 / 디코더</h1>
      <p class="desc">한글을 포함한 텍스트도 UTF-8로 안전하게 변환합니다.</p>
    </div>

    <div class="ad-slot">광고 영역 (애드센스 승인 후 표시)</div>

    <div class="panel">
      <div class="field">
        <label for="input">입력</label>
        <textarea id="input" placeholder="여기에 텍스트 또는 Base64 문자열을 입력하세요"></textarea>
      </div>
      <div class="btn-row">
        <button class="btn primary" onclick="enc()">인코딩 →</button>
        <button class="btn primary" onclick="dec()">← 디코딩</button>
        <button class="btn" onclick="swap()">입력↔결과 교환</button>
        <button class="btn" onclick="clearAll()">지우기</button>
      </div>
      <div id="msg" class="msg"></div>
      <div class="field" style="margin-top:8px">
        <label for="output">결과</label>
        <textarea id="output" readonly></textarea>
      </div>
      <div class="btn-row">
        <button class="btn" onclick="copyText(document.getElementById('output').value, this)">결과 복사</button>
      </div>
    </div>

    <div class="ad-slot">광고 영역 (애드센스 승인 후 표시)</div>
  </main>

  <footer class="site-footer">
    <nav><a href="../index.html">홈</a><a href="json-formatter.html">JSON</a><a href="timestamp.html">타임스탬프</a><a href="color-converter.html">색상</a></nav>
    <div>© 2026 불편함 해결소 · 입력한 데이터는 서버로 전송되지 않습니다.</div>
  </footer>

  <script src="../assets/app.js"></script>
  <script>
    var msg = document.getElementById('msg');
    function show(t, ok){ msg.textContent=t; msg.className='msg '+(ok?'ok':'err'); }
    function enc(){
      var s = document.getElementById('input').value;
      if(!s){ show('인코딩할 텍스트를 입력하세요.', false); return; }
      try {
        var b = btoa(unescape(encodeURIComponent(s)));
        document.getElementById('output').value = b;
        show('✓ 인코딩 완료.', true);
      } catch(e){ show('❌ 인코딩 실패: '+e.message, false); }
    }
    function dec(){
      var s = document.getElementById('input').value.trim();
      if(!s){ show('디코딩할 Base64를 입력하세요.', false); return; }
      try {
        var t = decodeURIComponent(escape(atob(s)));
        document.getElementById('output').value = t;
        show('✓ 디코딩 완료.', true);
      } catch(e){ show('❌ 올바른 Base64 문자열이 아닙니다.', false); }
    }
    function swap(){
      var i=document.getElementById('input'), o=document.getElementById('output');
      var t=i.value; i.value=o.value; o.value=t; msg.textContent='';
    }
    function clearAll(){
      document.getElementById('input').value=''; document.getElementById('output').value=''; msg.textContent='';
    }
  </script>
</body>
</html>
